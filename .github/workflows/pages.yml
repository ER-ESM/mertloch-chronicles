name: Test and publish game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Finish the active main deployment; frequent pushes previously kept the live game stale.
  # GitHub keeps only the latest pending run, while PR checks may still be superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test game and world generation
        run: npm test
      - name: Build static game
        run: npm run build
      - name: Check reusable UI sprites and MMO masks
        run: npm run ui:kit:browser
      - name: Check Clanbook and mobile layouts
        run: npm run ui:check
      - name: Check damage and healing meter
        run: npm run meter:check
      - name: Check companion animations, combat text and meter
        run: node scripts/companion-combat-check.mjs
      - name: Check companion selection and healing
        run: node scripts/companion-aid-check.mjs
      - name: Check HUD editing and buff/debuff bars
        run: npm run hud:check
      - name: Check kiosk trading and mobile shop
        run: npm run shop:check
      - name: Check professions with two online players
        run: npm run professions:check
      - name: Check mount collection and online riders
        run: npm run mounts:check && npm run mounts:online-check
      - name: Check entering and leaving the kiosk instance
        run: npm run kiosk:check
      - name: Check offline starts and update recovery
        run: node scripts/basis-pwa-check.mjs
      - name: Keep browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            visual-review/ui-regression/
            visual-review/ui-kit/
            visual-review/meter/
            visual-review/companion-combat/
            visual-review/companion-aid/
            visual-review/hud/
            visual-review/shop/
            visual-review/professions/
            visual-review/mounts/
            visual-review/kiosk-instance/
            combat-review/basis-pwa/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
