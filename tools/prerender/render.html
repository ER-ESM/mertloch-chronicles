<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Pre-Render (E-30)</title>
<style>body{margin:0;background:#223a2f;color:#f4e8c4;font:12px system-ui}#out{display:flex;flex-wrap:wrap;gap:4px;padding:8px}#out canvas{image-rendering:pixelated;background:#0b1216;border:1px solid #c9a46f}</style></head>
<body><div id="out"></div>
<script>window.addEventListener("error",e=>{window.prerenderError=String(e.message||e.error);});window.addEventListener("unhandledrejection",e=>{window.prerenderError=String(e.reason);});</script>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
import {buildHero,attachGear,GEAR_ASSETS} from './rig.js';
import {POSES,walkPose,poseLift,COLUMNS,WALK_FRAMES} from './poses.js';
// Ziel: Präzisions-Format (assets/precision/runtime): 4 native Pixel je Welteinheit, Bild 192², Fußpunkt (96,160), vier Richtungen se/sw/ne/nw.
const PPU=4,SIZE=192,PIVOT={x:96,y:160},BIG=288;
const DIRECTIONS={se:-40,sw:40,ne:-140,nw:140};// Gier des Modells in Grad; Kamera steht fest
const PALETTE=['242333','413440','67463e','926044','b67b50','dda071','f4c698','ffe6bb','f8f0d5','c8c5af','898c83','526d76','334d59','243841','354b36','55704a','849451','bac475','953d32','ce5d31','ec8b36','f3b84b','95653e','634b37','171f29','364047','786259','9f806d','d49779','edb495','fff2d6','d9d7c2','aaab98','719090','456476','768a67','a6ac80','b74724','e57438','ffd274'].map(h=>[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]);
const OUTLINE=[0x17,0x1f,0x29];
const canvas=document.createElement('canvas');canvas.width=BIG;canvas.height=BIG;
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(BIG,BIG,false);renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();
const hemi=new THREE.HemisphereLight(0xfff2d6,0x55704a,1.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe6bb,2.4);sun.position.set(-30,50,40);scene.add(sun);scene.add(new THREE.AmbientLight(0xffffff,.35));// Licht links oben (E-10)
// Orthografische Kamera: BIG px entsprechen BIG/PPU Welteinheiten; leichte Aufsicht wie die gelieferten Sprites.
const span=BIG/PPU,camera=new THREE.OrthographicCamera(-span/2,span/2,span/2,-span/2,-500,500);
const PITCH=20*Math.PI/180;camera.position.set(0,Math.sin(PITCH)*200+13,Math.cos(PITCH)*200);camera.lookAt(0,13,0);camera.updateMatrixWorld();
const heroes=new Map();
function hero(classId){if(!heroes.has(classId)){const h=buildHero(classId);scene.add(h.root);h.root.visible=false;heroes.set(classId,h);}return heroes.get(classId);}
function applyPose(h,name,t){for(const bone of Object.values(h.bones))bone.rotation.set(0,0,0);const pose=typeof t==='number'?walkPose(t):POSES[name]||POSES.idle;for(const [k,v] of Object.entries(pose)){const bone=h.bones[k];if(bone)bone.rotation.set(v.x,v.y,v.z);}h.bones.hips.position.y=h.body.legs+poseLift(name,t);}
function setLayer(h,mode){h.root.traverse(o=>{if(!o.isMesh)return;if(o.userData.body){o.visible=true;o.material.colorWrite=mode==='body';o.material.depthWrite=true;o.material.transparent=false;}else if(o.userData.gear){o.visible=mode==='gear';}});}
const v=new THREE.Vector3();
function project(obj,offset){obj.getWorldPosition(v);v.project(camera);return {x:(v.x+1)/2*BIG-offset.x,y:(1-v.y)/2*BIG-offset.y};}
/** Rendert ein Bild, quantisiert auf die Palette, zieht eine 1-px-Kontur und schneidet 192² um den Fußpunkt. */
function shoot(h,offsetHint){
 renderer.render(scene,camera);
 const gl=renderer.getContext(),raw=new Uint8Array(BIG*BIG*4);gl.readPixels(0,0,BIG,BIG,gl.RGBA,gl.UNSIGNED_BYTE,raw);
 const src=new Uint8ClampedArray(BIG*BIG*4);for(let y=0;y<BIG;y++)src.set(raw.subarray((BIG-1-y)*BIG*4,(BIG-y)*BIG*4),y*BIG*4);
 // Fußpunkt des Modells (0,0,0) → Zuschnitt so, dass er auf PIVOT liegt
 const origin=new THREE.Vector3(0,0,0).project(camera),ox=Math.round((origin.x+1)/2*BIG-PIVOT.x),oy=Math.round((1-origin.y)/2*BIG-PIVOT.y);
 const out=new Uint8ClampedArray(SIZE*SIZE*4);
 const at=(x,y)=>(y*BIG+x)*4;
 for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){const sx=x+ox,sy=y+oy;if(sx<0||sy<0||sx>=BIG||sy>=BIG)continue;const i=at(sx,sy),o=(y*SIZE+x)*4;if(src[i+3]<110)continue;
  let best=0,bd=1e9;for(let p=0;p<PALETTE.length;p++){const c=PALETTE[p],d=(c[0]-src[i])**2*.3+(c[1]-src[i+1])**2*.59+(c[2]-src[i+2])**2*.11;if(d<bd){bd=d;best=p;}}
  const c=PALETTE[best];out[o]=c[0];out[o+1]=c[1];out[o+2]=c[2];out[o+3]=255;}
 // Kontur: transparente Nachbarn opaker Pixel werden Schieferdunkel
 const opaque=new Uint8Array(SIZE*SIZE);for(let i=0;i<SIZE*SIZE;i++)opaque[i]=out[i*4+3]>0?1:0;
 for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){const i=y*SIZE+x;if(opaque[i])continue;const n=(x>0&&opaque[i-1])||(x<SIZE-1&&opaque[i+1])||(y>0&&opaque[i-SIZE])||(y<SIZE-1&&opaque[i+SIZE]);if(n){const o=i*4;out[o]=OUTLINE[0];out[o+1]=OUTLINE[1];out[o+2]=OUTLINE[2];out[o+3]=255;}}
 return {pixels:out,offset:{x:ox,y:oy}};
}
function toDataUrl(pixels){const c=document.createElement('canvas');c.width=SIZE;c.height=SIZE;c.getContext('2d').putImageData(new ImageData(pixels,SIZE,SIZE),0,0);return c.toDataURL('image/png');}
function sockets(h,offset,west){
 const p=name=>project(h.bones[name],offset);
 const head=p('head'),neck=p('neck'),chest=p('chest'),hips=p('hips'),sl=p('shoulderL'),sr=p('shoulderR'),hl=p('handL'),hr=p('handR'),fl=p('footL'),fr=p('footR');
 const torsoH=Math.abs(hips.y-neck.y),torsoW=Math.abs(sr.x-sl.x);
 return {main:{x:hr.x,y:hr.y},off:{x:hl.x,y:hl.y},head:{x:head.x,y:head.y-h.body.head*PPU*.55},torso:{x:chest.x,y:(neck.y+hips.y)/2,w:Math.max(8,torsoW),h:Math.max(8,torsoH)},waist:{x:hips.x,y:hips.y},shoulders:[sl,sr].sort((a,b)=>a.x-b.x),feet:[fl,fr].sort((a,b)=>a.x-b.x).map(f=>({x:f.x,y:f.y+1.2*PPU})),back:false};
}
/**
 * Rendert für eine Figur alle Bilder: base (Körper) und je Ausrüstungsteil eine Ebene (Körper nur als Tiefenmaske).
 * Rückgabe je Bogen: {frames:[{dir,column,png,sockets}]} für „poses" (8 Spalten) und „walk" (8 Laufbilder).
 */
window.prerender={
 assets:GEAR_ASSETS,
 async render(classId,assets=GEAR_ASSETS,{preview=false,base=true}={}){
  const h=hero(classId);for(const o of heroes.values())o.root.visible=false;h.root.visible=true;
  // Ausrüstung einmal anhängen, per Sichtbarkeit schalten
  const gearMeshes=new Map();for(const a of assets)gearMeshes.set(a,attachGear(h,a));
  const showGear=asset=>{for(const [a,list] of gearMeshes)for(const m of list)m.visible=a===asset;};
  const result={poses:{base:[],gear:{}},walk:{base:[],gear:{}}};
  const shots=[];for(const [dir,yaw] of Object.entries(DIRECTIONS)){for(const col of COLUMNS)shots.push({sheet:'poses',dir,yaw,name:col,t:undefined});for(let i=0;i<WALK_FRAMES;i++)shots.push({sheet:'walk',dir,yaw,name:'walk',t:i/WALK_FRAMES});}
  for(const s of shots){
   h.root.rotation.y=s.yaw*Math.PI/180;applyPose(h,s.name,s.t);h.root.updateMatrixWorld(true);
   if(base){setLayer(h,'body');showGear(null);const shot=shoot(h);const soc=sockets(h,shot.offset,s.dir.endsWith('w'));result[s.sheet].base.push({dir:s.dir,column:s.name,png:toDataUrl(shot.pixels),sockets:soc});if(preview){const c=document.createElement('canvas');c.width=SIZE;c.height=SIZE;c.getContext('2d').putImageData(new ImageData(shot.pixels,SIZE,SIZE),0,0);document.querySelector('#out').append(c);}}
   setLayer(h,'gear');
   for(const a of assets){showGear(a);const layer=shoot(h);(result[s.sheet].gear[a]||=(result[s.sheet].gear[a]=[])).push({dir:s.dir,column:s.name,png:toDataUrl(layer.pixels)});}
  }
  for(const list of gearMeshes.values())for(const m of list)m.parent?.remove(m);
  return result;
 }
};
window.prerenderReady=true;
</script></body></html>
